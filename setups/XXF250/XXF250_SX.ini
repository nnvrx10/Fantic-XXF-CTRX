; Fantic XXF 250 - Supercross (SX) - setup sheet for the MX Bikes garage (dial in by hand, then Save in-game)
; Clicks/turns = out from fully closed. OilLevel = air gap in mm (lower = more oil). See README.md.

[Bike]
Name=MX2OEM_Fantic_XXF_250
Discipline=SX
Map=BlueRace

[Drivetrain]
FrontSprocket=13
RearSprocket=52

[FrontSuspension]
SpringRate=5.1
Preload=5.0
OilLevel=90
Compression=6
Rebound=8
ForkHeight=4.0
ForkOffset=22.0

[RearSuspension]
SpringRate=60.0
Preload=8.0
RaceSag=102
LowSpeedCompression=7
HighSpeedCompression=1.00
Rebound=9
RodLength=144.0

[Tyres]
FrontPressure=0.95
RearPressure=0.90

[GarageLimits]
; Run these at the garage limit even if your limit differs from the number above.
ForkSpringRate=MAX
ForkOilLevel=MIN
RodLength=MAX
