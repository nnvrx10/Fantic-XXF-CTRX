; Fantic XXF 450 - Supercross (SX) - setup sheet for the MX Bikes garage (dial in by hand, then Save in-game)
; Clicks/turns = out from fully closed. OilLevel = air gap in mm (lower = more oil). See README.md.

[Bike]
Name=MX1OEM_Fantic_XXF_450
Discipline=SX
Map=BlueRace

[Drivetrain]
FrontSprocket=13
RearSprocket=50

[FrontSuspension]
SpringRate=5.4
Preload=5.0
OilLevel=90
Compression=5
Rebound=8
ForkHeight=4.0
ForkOffset=22.0

[RearSuspension]
SpringRate=62.0
Preload=8.0
RaceSag=102
LowSpeedCompression=6
HighSpeedCompression=0.75
Rebound=8
RodLength=144.0

[Tyres]
FrontPressure=0.95
RearPressure=0.90

[GarageLimits]
; Run these at the garage limit even if your limit differs from the number above.
ForkSpringRate=MAX
ForkOilLevel=MIN
RodLength=MAX
